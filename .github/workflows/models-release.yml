name: 模型索引与增量发布

# ── 职责划分：Python 管"算"，工作流管"发" ──────────────────────────────
# models_tool.py 是 models/ 目录的唯一权威，文件系统与 JSON 逻辑全在它里面：
#   · 扫描 models/、生成根目录 models.json
#   · 读 models.json 当基线，识别哪些模型是新增的
#   · 把新增模型整目录复制到 live2d_v3_models_new/（按顶层目录归并，不重复拷）
#   · 跟 git 里已提交的那版索引对比，算出"已消失"
#   · 把上面的计划打成一行 JSON 交给工作流
# 工作流只保留必须靠外部命令的三件事：`zip` 打包、`gh` 发 Release、`git` 提交。
#
# ⚠️ 这里原本有一大段内联 bash（find + comm + awk 归并 + 内联 python 做 diff），
#    现在全挪进脚本了 —— 目录名带空格/中文/多层嵌套时，bash 里每加一个引号
#    就是一次踩坑（旧版的 awk 归并还会把同组多个新增模型重复复制好几遍）。
#
# 一轮下来发生的事：
#   1. `python3 models_tool.py -job release | tee plan.json`
#        · 准备 live2d_v3_models_new/（只含新增模型）
#        · 重写根目录 models.json（新的一份就是下一轮的基线）
#   2. 读 plan.json 最后一行 JSON → total / new / gone / 新模型清单
#   3. 打包 all.zip（全部模型）/ new.zip（仅本轮新增）
#   4. 发 Release，并就地刷新 models-latest 固定指针
#   5. 提交 models.json —— 这一步就是"基线回写"
#
# ⚠️ 基线文件是 models.json（不再是 models.txt），一物两用：
#      页面靠它发现模型，发布流程靠它做增量。别再往仓库里塞第二份清单。
# ⚠️ "回写基线"失败 = 下一轮会把这批模型再当成新增重发一遍，
#      所以下面的 push 有重试、最终失败直接让 run 变红（不静默吞）。
# ⚠️ 首次运行（仓库里没有 models.json）只建索引、不发布也不复制：
#      没有基线时全部模型都会被判成新增，发一个名叫 new 却装着全部的包毫无意义。

# ── 触发 ────────────────────────────────────────────────────────────────
# 「每隔 7 天」在 GitHub 的 cron 里写不出来：它只有 分/时/日/月/星期 五个字段，
# 常见的 `0 3 */7 * *` 是「每月 1/8/15/22/29 号」，月末会缩成 1~3 天（1/29→2/1）。
# 所以改成**每天触发一次**，再用「Unix 纪元天数 % 7」卡成精确的 7 天。
# 附带好处：GitHub 的定时工作流在高负载时会延迟甚至整轮跳过，每天都有一次机会，
# 比「每 7 天只有一次机会」稳得多；而且仓库要是一直没动静，schedule 会被自动停用。
# 手动触发（workflow_dispatch）不受这道闸门限制。
on:
  schedule:
    - cron: '0 3 * * *'          # 每天 UTC 03:00
  workflow_dispatch:
    inputs:
      force_publish:
        description: 即使没有新增模型，也发布一份全量包
        type: boolean
        default: false
      prune_keep:
        description: 回收旧 Release，只保留最近 N 个（0 = 不回收）
        type: string
        default: '0'

permissions:
  contents: write                # 建 Release 需要；回写 models.json 也需要

# 同一时间只跑一个，后来的排队等 —— 否则两个 run 会读到同一份 models.json 重复发布
concurrency:
  group: live2d-v3-models-release
  cancel-in-progress: false

jobs:
  index-and-publish:
    runs-on: ubuntu-latest

    env:
      FORCE: ${{ github.event.inputs.force_publish == 'true' }}
      # 模型名里大量中文/日文（Azue Lane(JP)、用户上传…）。GitHub runner 的
      # 默认 locale 是 C.UTF-8，Python 在 C locale 下 stdout 会退化成 ASCII，
      # print 一个中文模型名就 UnicodeEncodeError。脚本自己 reconfigure 了
      # stdout，这里再加一层环境变量兜底（子进程/异常回溯也一起受益）。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      LANG: C.UTF-8

    steps:
      # 闸门刻意放在最前面、且不做 checkout —— 不到日子就不克隆这个两百多兆的仓库
      - name: 7 天闸门
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "手动触发，跳过闸门"
            exit 0
          fi
          day=$(( $(date -u +%s) / 86400 ))
          if [ $(( day % 7 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "纪元第 ${day} 天，%7 == 0，本轮执行"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "纪元第 ${day} 天，%7 == $(( day % 7 ))，本轮跳过"
          fi

      - name: 检出
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # ── 扫描 / 增量识别 / 复制新增：全在 models_tool.py 里 ────────────
      - name: 生成索引并准备新增模型
        id: build
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # 脚本最后一行打一行 JSON（人类可读日志照常进 CI 日志）。
          # tee 存一份给后面几个步骤读 —— 不解析人类可读输出，省得改日志就把工作流带崩。
          python3 models_tool.py -job release | tee "$RUNNER_TEMP/plan.json"
          plan=$(tail -n 1 "$RUNNER_TEMP/plan.json")

          # 一条命令把 JSON 字段写进 $GITHUB_OUTPUT（runner 自带 python，不必依赖 jq）
          # ⚠️ 布尔要显式转成小写 'true'/'false'：Python 的 str(True) 是 'True'，
          #    而后面步骤判的是 `== 'true'`，直接写进去首次运行那条分支永远不生效。
          python3 - "$plan" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          p = json.loads(sys.argv[1])
          for k in ('total', 'new', 'gone'):
              print('%s=%s' % (k, p[k]))
          print('first=%s' % ('true' if p['first'] else 'false'))
          PY

          # 生成的 Release 说明正文；步骤汇总也复用它
          python3 - "$plan" <<'PY' > "$RUNNER_TEMP/plan.md"
          import json, sys
          p = json.loads(sys.argv[1])
          if p['new_models']:
              print('## 新增模型（%d 个）' % p['new'])
              print()
              for m in p['new_models']:
                  print('- %s' % m)
              print()
          elif not p['first']:
              print('_本轮无新增模型。_')
              print()
          if p['gone_models']:
              print('## 已消失（%d 个）' % p['gone'])
              print()
              for m in p['gone_models']:
                  print('- %s' % m)
              print()
          PY

      # ── 打包：两份 zip，内部都保留 models/ 顶层目录，解到仓库根即可 ──
      - name: 打包
        id: pack
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if [ "${{ steps.build.outputs.new }}" = "0" ] && [ "$FORCE" != "true" ]; then
            echo "没有新增模型，且未勾选强制发布 → 不打包"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ubuntu-latest 自带 zip，这里只是兜底（缺了才装，装上也是几秒）
          command -v zip >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }

          echo "打包全量包 …"
          # -X：不写入 UID/GID 等 Unix 扩展属性，免得在不同系统上解压出怪权限
          zip -r -q -X live2d_v3_models_all.zip models

          # 增量包：models_tool.py 已把新增模型按**原层级**复制进 live2d_v3_models_new/
          # （即它已经是 models/ 内部的形状），这里只给它套一层 models/ 顶层目录，
          # 好让两个包的解压方式完全一致：都解到仓库根。
          # ⚠️ 直接 `zip -r new.zip live2d_v3_models_new` 会让解压出来多一层
          #    live2d_v3_models_new/，用户得自己再挪一遍。
          # ⚠️ zip 的输出用**绝对路径**：某些 zip 构建对带 .. 的相对路径会报
          #    `Could not create output file`。
          if [ "${{ steps.build.outputs.new }}" != "0" ]; then
            echo "打包增量包 …"
            rm -rf _pack_new
            mkdir -p _pack_new/models
            cp -a live2d_v3_models_new/. _pack_new/models/
            ( cd _pack_new && zip -r -q -X "$GITHUB_WORKSPACE/live2d_v3_models_new.zip" models )
            echo "has_new_zip=true" >> "$GITHUB_OUTPUT"
          else
            echo "没有新增模型（强制发布），跳过增量包"
            echo "has_new_zip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "published=true" >> "$GITHUB_OUTPUT"
          ls -lh live2d_v3_models_*.zip

      # ── 发布：用 runner 自带的 gh CLI，不再引第三方 action ──
      - name: 发布 Release
        id: release
        if: steps.pack.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          notes="$RUNNER_TEMP/notes.md"

          # ⚠️ tag 必须带 run number：只写日期的话同一天手动触发两次会撞名，
          #    `gh release create` 直接报 already exists 挂掉。
          #    回收 step 的正则也依赖这个形状：models-<8位日期>-<数字>。
          tag="models-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"

          cat "$RUNNER_TEMP/plan.md" > "$notes"
          {
            echo "| 文件 | 内容 |"
            echo "|---|---|"
            echo '| `live2d_v3_models_all.zip` | `models/` 全部 '"${{ steps.build.outputs.total }}"' 个模型 |'
            if [ "${{ steps.pack.outputs.has_new_zip }}" = "true" ]; then
              echo '| `live2d_v3_models_new.zip` | 仅本次新增的 '"${{ steps.build.outputs.new }}"' 个模型 |'
            fi
            echo
            # ⚠️ 这一句必须用**单引号**：双引号里反引号是命令替换，
            #    `models/` 会被 bash 拿去当命令执行（失败、返回空），
            #    于是 Release 说明里那几个字就凭空消失了。
            echo '> 两个包内部都带 `models/` 顶层目录，**解压到仓库根目录**即可。'
            echo '> `models.json` 由 `models_tool.py` 生成并随仓库分发，包内不含。'
          } >> "$notes"

          files=(live2d_v3_models_all.zip)
          if [ "${{ steps.pack.outputs.has_new_zip }}" = "true" ]; then
            files+=(live2d_v3_models_new.zip)
          fi

          gh release create "$tag" --title "$tag" --notes-file "$notes" "${files[@]}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "已发布 $tag"

          # ── latest 指针：tag 固定 models-latest，资产每轮覆盖 ──
          # 刻意**不删了重建**，改成就地 `upload --clobber`：删了重建有几秒空窗，
          # 那期间下载链接是 404。代价是 models-latest 的 created_at 停在首次创建那天，
          # GitHub 的「Latest」徽标会落在最新那个时间戳 release 上。
          # 但两者是同一轮发布的同一批资产，所以下面两个地址指向同样的包：
          #   /releases/download/models-latest/live2d_v3_models_all.zip   ← tag 写死
          #   /releases/latest/download/live2d_v3_models_all.zip          ← GitHub 自动
          latest="models-latest"
          {
            cat "$notes"
            echo
            echo "---"
            echo '本 Release 是**最新快照**，每次发布都会被覆盖（tag 固定为 `models-latest`）。'
            echo '固定下载地址：'
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${latest}/live2d_v3_models_all.zip"
            echo '```'
            echo
            echo "本次来源：\`${tag}\`（run ${GITHUB_RUN_ID}）"
          } > "$RUNNER_TEMP/notes_latest.md"

          if gh release view "$latest" >/dev/null 2>&1; then
            echo "更新 latest 指针 …"
            gh release upload "$latest" "${files[@]}" --clobber
            gh release edit "$latest" --title "latest" --notes-file "$RUNNER_TEMP/notes_latest.md"
            # 这一轮没出增量包，就把 latest 上残留的 new.zip 摘掉，
            # 免得它一直挂着一个早已不是「新增」的包
            if [ "${{ steps.pack.outputs.has_new_zip }}" != "true" ]; then
              gh release delete-asset "$latest" live2d_v3_models_new.zip --yes 2>/dev/null || true
            fi
          else
            echo "首次创建 latest 指针 …"
            gh release create "$latest" --title "latest" --notes-file "$RUNNER_TEMP/notes_latest.md" "${files[@]}"
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # ── 可选回收：默认 0 = 一个都不删 ──
      # 每份 all.zip ≈ models/ 的体积（45 个模型 ~200MB+），一年 52 轮 ≈ 11GB，
      # 迟早撑爆仓库配额。想自动回收，手动触发时把 prune_keep 填成要保留的个数。
      # ⚠️ 定时触发时 inputs 是 null，而 `null != '0'` 求值为 true —— 这条 if 挡不住。
      #    真正拦住的是下面 case 的第一支。两道都要留着。
      - name: 回收旧 Release（可选）
        if: steps.gate.outputs.run == 'true' && github.event.inputs.prune_keep != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep="${{ github.event.inputs.prune_keep }}"
          case "$keep" in ''|*[!0-9]*) echo "prune_keep 不是数字（$keep），跳过"; exit 0 ;; esac
          [ "$keep" -gt 0 ] || exit 0

          # ⚠️ 正则必须**只匹配带时间戳的 tag**（models-20260922-123），
          #    写成 `grep '^models-'` 会把固定指针 `models-latest` 也圈进来删掉。
          #    gh release list 默认按创建时间倒序，前 keep 个就是最新的。
          #    `|| true` 是给 grep 兜底：一条都没匹配到时它退出码是 1，
          #    配 set -euo pipefail 会让整步失败（mapfile 那行的失败尤其难看出原因）。
          mapfile -t tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^models-[0-9]{8}-[0-9]+$' || true)
          if [ "${#tags[@]}" -le "$keep" ]; then
            echo "现有 ${#tags[@]} 个 Release，未超过保留数 $keep，不回收"
            exit 0
          fi
          for t in "${tags[@]:$keep}"; do
            echo "删除 $t"
            gh release delete "$t" --yes --cleanup-tag
          done

      # ── 回写基线：无论发没发布都要提交，否则下一轮会把老模型当新增重发 ──
      - name: 提交 models.json
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json
          if git diff --cached --quiet; then
            echo "models.json 无变化，不提交"
            exit 0
          fi

          git commit -m "chore(models): 刷新 models.json（${{ steps.build.outputs.total }} 个模型）"

          # ⚠️ 这一步失败是有后果的：基线没更新，下一轮会把这批模型再当成"新增"
          #    重发一遍。所以失败要重试，且最终失败必须让 run 变红，不能静默放过。
          #    （并发已被 concurrency 挡住，这里防的是"跑的过程中仓库被推了新提交"。）
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "::warning::推送失败（第 ${attempt} 次），rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::models.json 推送失败 —— 基线没更新，下一轮会把这批模型再当成新增重发一遍"
            exit 1
          fi
          echo "已提交并推送 models.json"

      - name: 汇总
        if: steps.gate.outputs.run == 'true'
        run: |
          {
            echo "### 模型索引与发布（run ${{ github.run_id }}）"
            echo
            echo "- 现有模型：${{ steps.build.outputs.total }} 个"
            if [ "${{ steps.build.outputs.first }}" = "true" ]; then
              echo "- **首次运行**：仓库里没有 models.json，本轮只生成索引作为基线，未发布"
              echo "  （想立刻发一份全量包：手动触发并勾选 force_publish）"
            else
              echo "- 新增模型：${{ steps.build.outputs.new }} 个"
              echo "- 已消失模型：${{ steps.build.outputs.gone }} 个"
              if [ "${{ steps.pack.outputs.published }}" = "true" ]; then
                echo "- 已发布 Release：${{ steps.release.outputs.tag }}"
                echo
                echo "两个固定下载地址（内容相同，都是本轮这批资产）："
                echo '```'
                echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.latest }}/live2d_v3_models_all.zip"
                echo "https://github.com/${{ github.repository }}/releases/latest/download/live2d_v3_models_all.zip"
                echo '```'
              else
                echo "- 无新增，未发布"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
