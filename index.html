<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live2D 模型动作预览台</title>
<style>
  :root{
    --bg: #f2f4f8;
    --panel: #ffffff;
    --panel-2: #f7f9fc;
    --line: #e3e8f0;
    --line-strong: #d0d8e4;
    --text: #1c2430;
    --text-dim: #65718a;
    --text-faint: #9aa5b8;
    --accent: #3d6fe0;
    --accent-soft: #e8efff;
    --accent-2: #12a5a5;
    --danger: #d9534f;
    --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(28,36,48,.06), 0 2px 8px rgba(28,36,48,.05);
    --shadow-md: 0 2px 6px rgba(28,36,48,.07), 0 10px 28px rgba(28,36,48,.09);
  }
  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{ font-family:inherit; }

  /* ============ 布局 ============ */
  .app{ display:flex; flex-direction:column; height:100vh; }

  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:0 18px; height:56px; flex:0 0 56px;
    background:var(--panel); border-bottom:1px solid var(--line);
    box-shadow: var(--shadow-sm); z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand .logo{
    width:28px; height:28px; border-radius:8px; flex:0 0 28px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px; letter-spacing:.5px;
  }
  .brand h1{
    margin:0; font-size:15px; font-weight:650; letter-spacing:.2px;
    white-space:nowrap;
  }
  .brand .sub{ color:var(--text-faint); font-size:12px; white-space:nowrap; }
  .topbar .spacer{ flex:1 1 auto; }

  .seg{
    display:flex; background:var(--panel-2); border:1px solid var(--line);
    border-radius:9px; padding:2px; gap:2px;
  }
  .seg button{
    border:0; background:transparent; color:var(--text-dim);
    padding:5px 11px; border-radius:7px; cursor:pointer;
    font-size:12.5px; font-weight:550; white-space:nowrap;
    transition:background .16s, color .16s;
  }
  .seg button:hover{ color:var(--text); }
  .seg button.on{ background:var(--panel); color:var(--accent); box-shadow:var(--shadow-sm); }

  .tbtn{
    border:1px solid var(--line-strong); background:var(--panel);
    color:var(--text-dim); padding:6px 12px; border-radius:9px;
    cursor:pointer; font-size:12.5px; font-weight:550; white-space:nowrap;
    transition:.16s;
  }
  .tbtn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .tbtn.on{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  .main{ flex:1 1 auto; display:flex; min-height:0; }

  /* ============ 侧栏 ============ */
  .sidebar{
    width:286px; flex:0 0 286px; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .side-head{
    padding:14px 16px 10px; border-bottom:1px solid var(--line);
  }
  .side-head .t{ font-size:12px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--text-faint); }
  .side-head .n{ font-size:12px; color:var(--text-dim); margin-top:4px; }

  .model-list{ overflow-y:auto; padding:8px; flex:0 0 auto; max-height:44%; }
  .model-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:10px; cursor:pointer;
    border:1px solid transparent; transition:.15s;
  }
  .model-item:hover{ background:var(--panel-2); }
  .model-item.on{ background:var(--accent-soft); border-color:#c3d5fb; }
  .model-item .dot{
    width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:0 0 8px;
  }
  .model-item.on .dot{ background:var(--accent); }
  .model-item .meta{ min-width:0; }
  .model-item .name{
    font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .model-item.on .name{ color:var(--accent); }
  .model-item .desc{ font-size:11px; color:var(--text-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 分组树 */
  .group{ margin-bottom:2px; }
  .group-head{
    display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    padding:7px 8px; border-radius:8px; transition:.15s;
  }
  .group-head:hover{ background:var(--panel-2); }
  .group-head .caret{
    flex:0 0 12px; color:var(--text-faint); transition:transform .18s;
    display:flex; align-items:center; justify-content:center;
  }
  .group.collapsed .group-head .caret{ transform:rotate(-90deg); }
  .group-head .gname{
    font-size:12px; font-weight:650; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .group-head .gcount{
    margin-left:auto; font-size:10px; font-weight:700; color:var(--text-faint);
    background:var(--panel-2); border-radius:9px; padding:1px 7px; flex:0 0 auto;
  }
  .group-body{ padding-left:10px; }
  .group.collapsed .group-body{ display:none; }
  .group-body .model-item{ padding:7px 9px; }
  .group-body .model-item .name{ font-size:12.5px; }

  /* 搜索结果里的分组面包屑 */
  .model-item .crumb{
    font-size:10px; color:var(--text-faint); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .panel-title{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 6px; font-size:11.5px; font-weight:700; letter-spacing:.9px;
    text-transform:uppercase; color:var(--text-faint);
  }
  .search{
    margin:0 12px 8px; position:relative;
  }
  .search input{
    width:100%; border:1px solid var(--line-strong); border-radius:9px;
    padding:7px 10px 7px 28px; font-size:12.5px; outline:none;
    background:var(--panel-2); color:var(--text); font-family:inherit;
    transition:.15s;
  }
  .search input:focus{ border-color:var(--accent); background:var(--panel); box-shadow:0 0 0 3px var(--accent-soft); }
  .search svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.45; }

  .motion-list{ flex:1 1 auto; overflow-y:auto; padding:2px 10px 14px; }
  .motion-btn{
    width:100%; text-align:left; border:1px solid var(--line); background:var(--panel);
    border-radius:10px; padding:8px 11px; margin-bottom:6px; cursor:pointer;
    display:flex; align-items:center; gap:9px; color:var(--text);
    transition:.15s; font-size:12.5px;
  }
  .motion-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .motion-btn.on{ border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
  .motion-btn .idx{
    font-size:10.5px; font-weight:700; color:var(--text-faint);
    background:var(--panel-2); border-radius:5px; padding:2px 5px;
    min-width:22px; text-align:center; flex:0 0 auto;
  }
  .motion-btn.on .idx{ background:#fff; color:var(--accent); }
  .motion-btn .label{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .motion-btn .dur{ margin-left:auto; font-size:10.5px; color:var(--text-faint); flex:0 0 auto; }
  .motion-btn .tag{
    font-size:9.5px; padding:1px 5px; border-radius:4px; font-weight:700;
    background:#e6f6f4; color:#0e8a8a; flex:0 0 auto;
  }

  /* ============ 舞台 ============ */
  .stage-wrap{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .stage{
    flex:1 1 auto; position:relative; min-height:0; overflow:hidden;
    background:
      radial-gradient(1100px 620px at 50% 8%, #ffffff 0%, #f7f9fc 45%, #eaeff7 100%);
  }
  .stage.dark{
    background: radial-gradient(1100px 620px at 50% 8%, #2b3444 0%, #1e2531 48%, #141a23 100%);
  }
  #live2d-canvas-host{ position:absolute; inset:0; }
  #live2d-canvas-host canvas{ display:block; }

  .stage-hint{
    position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
    font-size:11.5px; color:var(--text-faint); pointer-events:none;
    background:rgba(255,255,255,.72); padding:4px 12px; border-radius:20px;
    backdrop-filter:blur(6px); white-space:nowrap;
  }
  .stage.dark .stage-hint{ background:rgba(20,26,35,.66); color:#95a1b5; }

  .badge{
    position:absolute; left:14px; top:12px; pointer-events:none;
    background:rgba(255,255,255,.82); border:1px solid var(--line);
    border-radius:9px; padding:6px 11px; backdrop-filter:blur(8px);
    box-shadow:var(--shadow-sm);
  }
  .stage.dark .badge{ background:rgba(20,26,35,.72); border-color:#333d4d; }
  .badge .b1{ font-size:12.5px; font-weight:650; }
  .badge .b2{ font-size:11px; color:var(--text-faint); margin-top:2px; }

  .overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; text-align:center; padding:24px;
    background:rgba(242,244,248,.9); backdrop-filter:blur(2px); z-index:5;
  }
  .stage.dark .overlay{ background:rgba(20,26,35,.88); }
  .overlay.hide{ display:none; }
  .overlay .msg{ font-size:13px; font-weight:600; max-width:520px; line-height:1.65; }
  .overlay .detail{
    font-size:11.5px; color:var(--text-dim); max-width:620px; line-height:1.7;
    font-family:ui-monospace,Consolas,monospace; word-break:break-word;
    white-space:pre-line; text-align:left;
  }
  .overlay .detail:empty{ display:none; }
  .overlay.error .msg{ color:var(--danger); }

  .spinner{
    width:26px; height:26px; border:2.5px solid var(--line-strong);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin .75s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ 底部控制条 ============ */
  .controls{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:0 -1px 3px rgba(28,36,48,.04); z-index:10;
  }
  .ctl{ display:flex; align-items:center; gap:7px; }
  .ctl > label{ font-size:11.5px; color:var(--text-dim); font-weight:600; white-space:nowrap; }
  .icon-btn{
    width:31px; height:31px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--panel); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s; flex:0 0 auto;
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .icon-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .icon-btn.primary:hover{ background:#3560c9; }

  input[type=range]{
    -webkit-appearance:none; appearance:none; height:4px; border-radius:3px;
    background:var(--line-strong); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid #fff;
    box-shadow:0 1px 3px rgba(28,36,48,.28);
  }
  .val{ font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums; min-width:30px; }

  .divider{ width:1px; height:22px; background:var(--line); }

  .sw{ display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .sw input{ display:none; }
  .sw .track{
    width:32px; height:18px; border-radius:10px; background:var(--line-strong);
    position:relative; transition:.18s; flex:0 0 auto;
  }
  .sw .track::after{
    content:""; position:absolute; top:2px; left:2px; width:14px; height:14px;
    border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .sw input:checked + .track{ background:var(--accent); }
  .sw input:checked + .track::after{ transform:translateX(14px); }
  .sw span{ font-size:11.5px; color:var(--text-dim); font-weight:600; white-space:nowrap; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#ccd5e2; border-radius:5px; border:2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover{ background:#b3bfd1; }

  .loading-mini{
    display:inline-block; width:11px; height:11px; border:2px solid var(--line-strong);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:-1px; margin-right:6px;
  }
  @media (max-width:860px){
    .sidebar{ width:230px; flex-basis:230px; }
    .brand .sub{ display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">L2D</div>
      <h1>Live2D 模型动作预览台</h1>
      <span class="sub" id="brandSub">—</span>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="modeSeg">
      <button data-mode="normal" class="on">常规</button>
      <button data-mode="manual">手动</button>
      <button data-mode="auto">自动轮播</button>
    </div>
    <button class="tbtn" id="btnTheme">深色舞台</button>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="side-head">
        <div class="t">模型列表</div>
        <div class="n" id="modelCount">加载中…</div>
      </div>
      <div class="search" style="margin-top:8px;">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="6.8" cy="6.8" r="4.6"/><path d="M10.3 10.3 14 14"/>
        </svg>
        <input type="text" id="modelSearch" placeholder="搜索模型…" autocomplete="off" />
      </div>
      <div class="model-list" id="modelList"></div>

      <div class="panel-title">
        <span>动作列表</span>
        <span id="motionCount" style="text-transform:none;letter-spacing:0;font-weight:600;"></span>
      </div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="6.8" cy="6.8" r="4.6"/><path d="M10.3 10.3 14 14"/>
        </svg>
        <input type="text" id="motionSearch" placeholder="筛选动作…" autocomplete="off" />
      </div>
      <div class="motion-list" id="motionList"></div>
    </aside>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div id="live2d-canvas-host"></div>
        <div class="badge" id="badge" style="display:none;">
          <div class="b1" id="badgeName">—</div>
          <div class="b2" id="badgeMotion">—</div>
        </div>
        <div class="stage-hint" id="stageHint">按住拖动可移动位置 · 滚轮缩放 · 双击复位</div>
        <div class="overlay" id="overlay">
          <div class="spinner" id="ovSpinner"></div>
          <div class="msg" id="ovMsg">正在初始化…</div>
          <div class="detail" id="ovDetail"></div>
        </div>
      </div>

      <div class="controls">
        <div class="ctl">
          <button class="icon-btn" id="btnPrev" title="上一个动作">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 3.2v9.6L4.2 8z"/><rect x="2.6" y="3.2" width="1.6" height="9.6" rx=".8"/></svg>
          </button>
          <button class="icon-btn primary" id="btnPlay" title="播放 / 暂停">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" id="icoPlay"><path d="M4.4 2.9v10.2L13 8z"/></svg>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" id="icoPause" style="display:none"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>
          </button>
          <button class="icon-btn" id="btnNext" title="下一个动作">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 3.2v9.6L11.8 8z"/><rect x="11.8" y="3.2" width="1.6" height="9.6" rx=".8"/></svg>
          </button>
          <button class="icon-btn" id="btnReplay" title="重播当前动作">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7"/><path d="M13.2 2.4v3.1h-3.1"/>
            </svg>
          </button>
        </div>

        <div class="divider"></div>

        <div class="ctl">
          <label>进度</label>
          <input type="range" id="progress" min="0" max="1000" value="0" step="1" style="width:190px;" />
          <span class="val" id="progressVal">0.00s</span>
        </div>

        <div class="ctl">
          <label>速度</label>
          <input type="range" id="speed" min="10" max="300" value="100" step="5" style="width:96px;" />
          <span class="val" id="speedVal">1.00×</span>
        </div>

        <div class="ctl">
          <label>缩放</label>
          <input type="range" id="zoom" min="20" max="400" value="100" step="1" style="width:96px;" />
          <span class="val" id="zoomVal">100%</span>
        </div>

        <div class="divider"></div>

        <label class="sw"><input type="checkbox" id="autoNext" /><span class="track"></span><span>播完自动下一个</span></label>
        <label class="sw"><input type="checkbox" id="showWire" /><span class="track"></span><span>显示网格</span></label>
        <button class="tbtn" id="btnReset">复位视图</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/live2dcubismcore.min.js"></script>
<script src="assets/pixi.min.js"></script>
<script src="assets/cubism4.min.js"></script>
<script>
(function () {
  'use strict';

  var CORE_URL = 'assets/live2dcubismcore.min.js';
  var STORAGE_KEY = 'l2d-viewer-state-v1';

  var els = {
    modelList:    document.getElementById('modelList'),
    modelCount:   document.getElementById('modelCount'),
    modelSearch:  document.getElementById('modelSearch'),
    motionList:   document.getElementById('motionList'),
    motionCount:  document.getElementById('motionCount'),
    motionSearch: document.getElementById('motionSearch'),
    host:         document.getElementById('live2d-canvas-host'),
    stage:        document.getElementById('stage'),
    overlay:      document.getElementById('overlay'),
    ovSpinner:    document.getElementById('ovSpinner'),
    ovMsg:        document.getElementById('ovMsg'),
    ovDetail:     document.getElementById('ovDetail'),
    badge:        document.getElementById('badge'),
    badgeName:    document.getElementById('badgeName'),
    badgeMotion:  document.getElementById('badgeMotion'),
    brandSub:     document.getElementById('brandSub'),
    btnPrev:      document.getElementById('btnPrev'),
    btnNext:      document.getElementById('btnNext'),
    btnPlay:      document.getElementById('btnPlay'),
    btnReplay:    document.getElementById('btnReplay'),
    icoPlay:      document.getElementById('icoPlay'),
    icoPause:     document.getElementById('icoPause'),
    progress:     document.getElementById('progress'),
    progressVal:  document.getElementById('progressVal'),
    speed:        document.getElementById('speed'),
    speedVal:     document.getElementById('speedVal'),
    zoom:         document.getElementById('zoom'),
    zoomVal:      document.getElementById('zoomVal'),
    autoNext:     document.getElementById('autoNext'),
    showWire:     document.getElementById('showWire'),
    btnReset:     document.getElementById('btnReset'),
    btnTheme:     document.getElementById('btnTheme'),
    modeSeg:      document.getElementById('modeSeg')
  };

  // ---------- 状态 ----------
  var S = {
    models: [],          // 发现的模型清单
    model: null,         // 当前模型
    alias: {},           // 友好名称映射
    motionNames: {},     // 动作友好名称映射
    motions: [],         // 当前模型的动件文件列表
    current: -1,         // 当前动作索引
    source: '',          // 模型清单来源：github / index / fallback
    collapsed: {},       // 分组折叠状态
    app: null,
    l2dModel: null,
    playing: true,
    speed: 1,
    motionClock: 0,      // 自维护的动作时间轴（秒），见 tickProgress
    holdTime: 0,         // 动作播完后定格的时间点
    pausedEntry: null,   // 暂停/定位/定格时挂在队列里的那一项（只挂一次，避免每帧重入队导致抖动）
    finished: false,     // 当前定格是不是「自然播完」造成的（据此决定按播放是重播还是续播）
    manual: false,       // 手动模式：用 seek 控制进度
    seekRequest: null,   // 手动模式下的目标时间
    view: { x: 0, y: 0, scale: 1 },
    dragging: false,
    dragStart: null,
    wire: null,          // 网格容器
    wireOn: false,
    busyModel: false,
    autoNext: false
  };

  // ---------- 工具 ----------
  function qs(o) { return Object.keys(o).filter(function (k) { return o[k]; }).map(function (k) { return k + '=' + o[k]; }).join('&'); }

  function fmtSec(s) {
    if (!isFinite(s)) return '—';
    return s.toFixed(2) + 's';
  }

  function prettyName(base) {
    var n = String(base).replace(/\.motion3\.json$/i, '').replace(/-/g, '_');
    var map = S.alias[base] || S.alias[n] || S.motionNames[base] || S.motionNames[n];
    if (map) return map;
    return n.split('_').map(function (w) {
      return w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    }).join(' ');
  }

  function modelTitle(m) {
    if (!m) return '';
    // 依次尝试：完整 key、目录路径、模型名
    var keys = [m.key, m.path, m.name];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (!k) continue;
      if (S.alias[k]) return S.alias[k];
      if (S.alias[k.replace(/_/g, '')]) return S.alias[k.replace(/_/g, '')];
    }
    return m.name;
  }

  function showOverlay(msg, detail, isError, spinning) {
    els.overlay.classList.remove('hide');
    els.overlay.classList.toggle('error', !!isError);
    els.ovSpinner.style.display = spinning === false ? 'none' : '';
    els.ovMsg.textContent = msg || '';
    els.ovDetail.textContent = detail || '';
  }
  function hideOverlay() { els.overlay.classList.add('hide'); }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        model: S.model ? S.model.key : null,
        motion: S.current,
        dark: els.stage.classList.contains('dark'),
        speed: S.speed,
        autoNext: S.autoNext,
        collapsed: S.collapsed
      }));
    } catch (e) { /* 忽略隐私模式下的写入失败 */ }
  }
  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; }
  }

  // ---------- 1. 发现模型 ----------
  // 三级降级：
  //   A. GitHub API 枚举仓库（真正零操作，仅仓库公开时可用，有频率限制）
  //   B. models/index.json（由 build_index.py 生成，离线也能用，Pages 上最稳）
  //   C. 内置兜底清单（任何情况下都能跑）
  function fetchJSON(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
      return r.json();
    });
  }

  function readManifest() {
    return fetchJSON('models/manifest.json').then(function (d) {
      if (d.alias) S.alias = d.alias;
      if (d.motions) S.motionNames = d.motions;
      return d;
    }).catch(function () { return {}; });
  }

  // 从 GitHub Pages / 自定义域名里推断出 用户名/仓库名
  function inferRepo() {
    var h = location.hostname;
    var m = /^([^.]+)\.github\.io$/i.exec(h);
    if (m) {
      var seg = location.pathname.split('/').filter(Boolean);
      return { owner: m[1], repo: seg[0] || (m[1] + '.github.io') };
    }
    return null;
  }

  // A. 通过 GitHub API 递归枚举仓库里的 .model3.json
  function discoverFromGitHubApi() {
    var info = inferRepo();
    if (!info) return Promise.reject(new Error('非 GitHub Pages 环境'));
    if (!info.owner || !info.repo) return Promise.reject(new Error('无法推断仓库信息'));

    var api = 'https://api.github.com/repos/' + info.owner + '/' + info.repo +
              '/git/trees/HEAD?recursive=1';
    return fetch(api, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('GitHub API ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j || !j.tree) throw new Error('GitHub API 返回异常');
        var found = [];
        j.tree.forEach(function (node) {
          if (node.type !== 'blob') return;
          if (!/\.model3\.json$/i.test(node.path)) return;
          if (node.path.indexOf('models/') !== 0) return;
          var rel = node.path.slice('models/'.length);
          var slash = rel.lastIndexOf('/');
          var dir = slash < 0 ? '' : rel.slice(0, slash);
          var file = slash < 0 ? rel : rel.slice(slash + 1);
          found.push({ path: dir, file: file, name: file.replace(/\.model3\.json$/i, '') });
        });
        if (!found.length) throw new Error('仓库里没有找到模型');
        return found;
      });
  }

  // B. 读取 build_index.py 生成的索引
  function discoverFromIndex() {
    return fetchJSON('models/index.json').then(function (d) {
      var list = (d && d.models) || [];
      if (!list.length) throw new Error('index.json 为空');
      return list;
    });
  }

  // 统一整理：补出 group / parts / key 等字段，供 UI 分组使用
  function decorate(list) {
    return list.map(function (m) {
      var p = m.path || '';
      var parts = p ? p.split('/').filter(Boolean) : [];
      var group = m.group !== undefined ? m.group : (parts.length > 1 ? parts.slice(0, -1).join('/') : '');
      var model = m.file || m.model || '';
      return {
        path: p,
        file: model,
        model: model,
        name: m.name || model.replace(/\.model3\.json$/i, ''),
        group: group,
        parts: m.parts || parts,
        motions: m.motions || 0,
        textures: m.textures || 0,
        mocVersion: m.mocVersion || '',
        key: p + '/' + model,          // 唯一标识，用于记忆上次选择
        missing: m.missing || []
      };
    });
  }

  function discoverModels() {
    S.source = '';
    return discoverFromGitHubApi()
      .then(function (list) { S.source = 'github'; return list; })
      .catch(function (e1) {
        return discoverFromIndex()
          .then(function (list) { S.source = 'index'; return list; })
          .catch(function (e2) {
            var fb = window.MODELS_FALLBACK || [];
            if (!fb.length) {
              var err = new Error('未发现任何模型');
              err.reasons = [e1 && e1.message, e2 && e2.message].filter(Boolean);
              throw err;
            }
            S.source = 'fallback';
            return fb;
          });
      })
      .then(function (list) { return decorate(list); });
  }

  // ---------- 2. 侧栏渲染 ----------
  function renderModels() {
    var kw = (els.modelSearch.value || '').trim().toLowerCase();
    els.modelList.innerHTML = '';

    var matched = S.models.filter(function (m) {
      if (!kw) return true;
      var hay = (modelTitle(m) + ' ' + m.name + ' ' + m.path).toLowerCase();
      return hay.indexOf(kw) !== -1;
    });

    var srcLabel = { github: 'GitHub API 自动发现', index: 'models/index.json', fallback: '内置清单' }[S.source] || '';
    els.modelCount.textContent = kw
      ? matched.length + ' / ' + S.models.length + ' 个'
      : '共 ' + S.models.length + ' 个' + (srcLabel ? ' · ' + srcLabel : '');

    if (!matched.length) {
      var empty = document.createElement('div');
      empty.className = 'model-item';
      empty.style.cursor = 'default';
      empty.innerHTML = '<div class="desc" style="font-size:11.5px;">没有匹配的模型</div>';
      els.modelList.appendChild(empty);
      return;
    }

    if (kw) {
      // 搜索时平铺展示，并标注它属于哪个分组
      matched.forEach(function (m) { els.modelList.appendChild(buildModelItem(m, true)); });
      return;
    }

    // 默认按分组折叠展示
    var groups = {}, order = [];
    matched.forEach(function (m) {
      var g = m.group || '';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(m);
    });

    // 有分组的排在前面，顶层散放的最后
    order.sort(function (a, b) {
      if (a === b) return 0;
      if (!a) return 1;
      if (!b) return -1;
      return a.toLowerCase() < b.toLowerCase() ? -1 : 1;
    });

    order.forEach(function (g) {
      if (!g) {
        groups[g].forEach(function (m) { els.modelList.appendChild(buildModelItem(m, false)); });
        return;
      }
      els.modelList.appendChild(buildGroup(g, groups[g]));
    });
  }

  function buildModelItem(m, showCrumb) {
    var el = document.createElement('div');
    var active = S.model && m.key === S.model.key;
    el.className = 'model-item' + (active ? ' on' : '');
    var sub = showCrumb && m.group ? m.group : '';
    var meta = '';
    if (m.motions) meta = m.motions + ' 个动作';
    el.innerHTML =
      '<div class="dot"></div>' +
      '<div class="meta" style="min-width:0;flex:1 1 auto;">' +
        '<div class="name">' + escapeHtml(modelTitle(m)) + '</div>' +
        '<div class="' + (sub ? 'crumb' : 'desc') + '">' +
          escapeHtml(sub || meta || m.name) +
        '</div>' +
      '</div>';
    el.title = m.path + '/' + m.file;
    el.addEventListener('click', function () { switchModel(m); });
    return el;
  }

  function buildGroup(name, list) {
    var wrap = document.createElement('div');
    var collapsed = !!S.collapsed[name];
    wrap.className = 'group' + (collapsed ? ' collapsed' : '');
    wrap.dataset.group = name;

    var head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML =
      '<span class="caret">' +
        '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M2.5 4.2 6 7.8l3.5-3.6"/></svg>' +
      '</span>' +
      '<span class="gname">' + escapeHtml(name) + '</span>' +
      '<span class="gcount">' + list.length + '</span>';
    head.title = name + '（点击折叠 / 展开）';
    head.addEventListener('click', function () {
      var nowCollapsed = !wrap.classList.contains('collapsed');
      wrap.classList.toggle('collapsed', nowCollapsed);
      S.collapsed[name] = nowCollapsed;
      saveCollapsed();
    });

    var body = document.createElement('div');
    body.className = 'group-body';
    list.forEach(function (m) { body.appendChild(buildModelItem(m, false)); });

    wrap.appendChild(head);
    wrap.appendChild(body);
    return wrap;
  }

  function saveCollapsed() {
    S.collapsed && saveState();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderMotions() {
    var kw = els.motionSearch.value.trim().toLowerCase();
    els.motionList.innerHTML = '';
    var shown = 0;
    S.motions.forEach(function (mo, i) {
      var label = prettyName(mo.base);
      if (kw && label.toLowerCase().indexOf(kw) === -1 && mo.base.toLowerCase().indexOf(kw) === -1) return;
      shown++;
      var btn = document.createElement('button');
      btn.className = 'motion-btn' + (i === S.current ? ' on' : '');
      btn.innerHTML =
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="label">' + escapeHtml(label) + '</span>' +
        (mo.loop ? '<span class="tag">循环</span>' : '') +
        '<span class="dur">' + (mo.duration ? mo.duration.toFixed(1) + 's' : '') + '</span>';
      btn.addEventListener('click', function () { playMotion(i); });
      els.motionList.appendChild(btn);
    });
    els.motionCount.textContent = kw ? shown + '/' + S.motions.length : S.motions.length + ' 个';
  }

  // ---------- 3. 载入模型 ----------
  function parseMotions(mf) {
    var raw = (mf.FileReferences && mf.FileReferences.Motions) || {};
    var out = [];
    Object.keys(raw).forEach(function (group) {
      (raw[group] || []).forEach(function (item, idx) {
        var file = item.File;
        if (!file) return;
        out.push({
          file: file,
          base: file.split('/').pop(),
          group: group,
          localIndex: idx,   // 该动作在所属分组内的下标，与 motionGroups 顺序一致
          loop: group === 'Idle' || /(^|\/)idle\./i.test(file) || /\bidle\b/i.test(file),
          duration: 0
        });
      });
    });
    return out;
  }

  function probeDurations(baseUrl) {
    return Promise.all(S.motions.map(function (mo) {
      return fetch(baseUrl + '/' + mo.file, { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var d = j && j.Meta && j.Meta.Duration;
          if (typeof d === 'number') { mo.duration = d; if (j.Meta.Loop === true) mo.loop = true; }
        })
        .catch(function () { /* 拿不到时长不影响预览 */ });
    }));
  }

  function switchModel(m) {
    if (S.busyModel) return;
    S.busyModel = true;
    showOverlay('正在载入模型 ' + modelTitle(m) + ' …', '读取模型配置与动作数据', false, true);

    // 模型的完整目录：models/<path>
    var baseUrl = 'models/' + (m.path ? m.path + '/' : '');
    var manifestUrl = baseUrl + m.file;
    var t0 = Date.now();

    fetchJSON(manifestUrl).then(function (mf) {
      S.model = m;
      S.motions = parseMotions(mf);
      S.current = -1;
      els.badgeName.textContent = modelTitle(m);
      els.badge.style.display = '';
      renderModels();
      renderMotions();
      return probeDurations(baseUrl);
    }).then(function () {
      renderMotions();
      showOverlay('正在载入模型 ' + modelTitle(m) + ' …', '解析纹理与网格', false, true);
      return loadIntoStage(manifestUrl);
    }).then(function () {
      // 先保证有动作在播，再撤掉遮罩，避免露出空白帧
      if (S.motions.length) playMotion(0, true);
      S.app.render();
      // 至少展示 350ms，避免加载过快时遮罩闪烁
      var wait = Math.max(0, 350 - (Date.now() - t0));
      return new Promise(function (res) { setTimeout(res, wait); });
    }).then(function () {
      hideOverlay();
      S.busyModel = false;
      saveState();
      // 若当前模型在折叠的分组里，自动展开该分组
      revealActiveModel();
    }).catch(function (e) {
      S.busyModel = false;
      showOverlay('模型载入失败：' + modelTitle(m), String((e && e.message) || e), true, false);
    });
  }

  function revealActiveModel() {
    if (!S.model || !S.model.group) return;
    if (!S.collapsed[S.model.group]) return;
    S.collapsed[S.model.group] = false;
    saveCollapsed();
    renderModels();
  }

  function loadIntoStage(manifestUrl) {
    return new Promise(function (resolve, reject) {
      // 卸载旧模型
      if (S.l2dModel) {
        try { S.app.stage.removeChild(S.l2dModel); S.l2dModel.destroy(); } catch (e) {}
        S.l2dModel = null;
      }
      return PIXI.live2d.Live2DModel.from(manifestUrl, {
        autoInteract: false,
        autoUpdate: true,
        idleMotionGroup: '',
        motionPreload: 'ALL'
      }).then(function (model) {
        S.l2dModel = model;
        S.app.stage.addChild(model);
        model.interactive = false;
        model.anchor.set(0.5, 0.5);

        // 时间轴完全由 tickProgress 接管（SDK 自带的 update 不累加时间，留着反而会
        // 用错误的帧间隔覆盖参数）
        model.autoUpdate = false;

        // 关闭自动默认动作，交由我们控制
        if (model.internalModel && model.internalModel.motionManager) {
          model.internalModel.motionManager.stopAllMotions();
        }

        // 眼部跟随鼠标
        model.on('pointermove', function () {});
        layoutModel(true);
        resolve(model);
      }).catch(reject);
    });
  }

  // ---------- 4. 舞台与缩放 ----------
  function stageSize() {
    var r = els.stage.getBoundingClientRect();
    return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
  }

  // 许多模型的 moc 画布是 3000x3000 之类的正方形，但角色实际只占其中一小块。
  // 直接用画布尺寸做自适应会把角色缩得非常小，因此按 drawable 顶点求真实包围盒。
  // 坐标换算与 SDK 的 getDrawableVertices 保持一致：
  //   px = vx * pixelsPerUnit + originalWidth  / 2
  //   py = -vy * pixelsPerUnit + originalHeight / 2
  function contentBounds(model) {
    var im = model.internalModel;
    var ow = (im && im.originalWidth) || model.width || 1;
    var oh = (im && im.originalHeight) || model.height || 1;
    var full = { x: 0, y: 0, w: ow, h: oh };

    var core = im && im.coreModel;
    var dd = core && core.drawables;
    if (!dd || !dd.vertexPositions || !dd.vertexCounts) return full;

    var ppu = im.pixelsPerUnit || 1;
    var vp = dd.vertexPositions, vc = dd.vertexCounts;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var off = 0, any = false;
    for (var i = 0; i < vc.length; i++) {
      var n = vc[i] | 0;
      for (var j = 0; j < n; j++) {
        var vx = vp[off + j * 2];
        var vy = vp[off + j * 2 + 1];
        if (!isFinite(vx) || !isFinite(vy)) continue;
        var px = vx * ppu + ow / 2;
        var py = -vy * ppu + oh / 2;
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
        any = true;
      }
      off += n * 2;
    }
    if (!any || !isFinite(minX) || maxX - minX < 1 || maxY - minY < 1) return full;
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  function fitScale(model) {
    if (!model) return 1;
    var box = stageSize();
    var b = contentBounds(model);
    if (!b.w || !b.h || !isFinite(b.w) || !isFinite(b.h)) return 1;
    // 留出边距，保证角色完整可见
    return Math.min((box.w * 0.88) / b.w, (box.h * 0.96) / b.h);
  }

  function layoutModel(refit) {
    if (!S.l2dModel || !S.app) return;
    var box = stageSize();
    S.app.renderer.resize(box.w, box.h);
    if (refit) { S.view.scale = fitScale(S.l2dModel); S.view.x = 0; S.view.y = 0; }
    applyView();
  }

  function applyView() {
    if (!S.l2dModel) return;
    var box = stageSize();
    var b = contentBounds(S.l2dModel);
    // 模型以锚点 (0.5,0.5) 定位，锚点落在画布中心 (ow/2, oh/2)。
    // 要让“内容包围盒中心”对上舞台中心，需额外偏移二者的差值。
    var ow = (S.l2dModel.internalModel && S.l2dModel.internalModel.originalWidth) || S.l2dModel.width || 1;
    var oh = (S.l2dModel.internalModel && S.l2dModel.internalModel.originalHeight) || S.l2dModel.height || 1;
    var dx = (b.x + b.w / 2) - ow / 2;
    var dy = (b.y + b.h / 2) - oh / 2;
    S.l2dModel.scale.set(S.view.scale);
    S.l2dModel.x = box.w / 2 + S.view.x - dx * S.view.scale;
    S.l2dModel.y = box.h / 2 + S.view.y - dy * S.view.scale;
  }

  function setZoomPercent(p) {
    if (!S.l2dModel) return;
    var base = fitScale(S.l2dModel);
    S.view.scale = base * (p / 100);
    applyView();
    els.zoom.value = String(p);
    els.zoomVal.textContent = Math.round(p) + '%';
  }

  function resetView() {
    S.view.x = 0; S.view.y = 0;
    els.zoom.value = '100';
    els.zoomVal.textContent = '100%';
    layoutModel(true);
  }

  // ---------- 5. 动作播放 ----------
  // 关键 API（实测 pixi-live2d-display 0.4 + Cubism 4/5 Core）：
  //   internalModel.motionManager                  动作管理器
  //   .motionGroups[groupName]                     已解析的动作对象数组（顺序与 definitions 一致）
  //   .queueManager._motions[]                     正在播放的队列项
  //   queueEntry._motion.getDuration()             动作时长（秒）
  //
  // 【重要】这个构建里 queueManager._userTimeSeconds 是死字段：
  //   Cubism4MotionManager 只有 updateParameters(coreModel, userTimeSeconds)，
  //   而它上层的 Cubism4InternalModel.update() 传进来的是「每帧秒数」(≈0.0167)，
  //   不是累计时钟。同时 queueManager.startMotion(motion, false, t) 的第三个参数被忽略，
  //   队列项的 startTime 恒为 0。
  //   结果：若依赖它，动作永远停在第一帧。
  //   因此时间轴由我们自己的 S.motionClock 维护，并换算成 doUpdateMotion 需要的「当前时间」。
  //
  //   播放路径：mm.queueManager.doUpdateMotion(coreModel, 当前时间秒)
  //   暂停/拖动的办法：直接操作队列项的 startTime（doUpdateMotion 用 当前时间 - startTime 求进度）
  function motionManager() {
    return S.l2dModel && S.l2dModel.internalModel && S.l2dModel.internalModel.motionManager;
  }

  function coreModel() {
    return S.l2dModel && S.l2dModel.internalModel && S.l2dModel.internalModel.coreModel;
  }

  function currentGroupName() {
    var mo = S.motions[S.current];
    return (mo && mo.group) || '';
  }

  // 取出当前正在播放的队列项
  function activeEntry() {
    var mm = motionManager();
    if (!mm || !mm.queueManager) return null;
    var list = mm.queueManager._motions || [];
    for (var i = list.length - 1; i >= 0; i--) {
      if (list[i] && list[i]._motion) return list[i];
    }
    return null;
  }

  // 当前动作已经播放的秒数
  function currentTime() {
    var e = activeEntry();
    if (!e) return 0;
    var mm = motionManager();
    // doUpdateMotion 里用的是「当前时间 - startTime」，两者都在 doUpdateMotion 的时间基上
    var t = mm.queueManager._doUpdateTime - e.getStartTime();
    if (!isFinite(t) || t < 0) t = 0;
    return t;
  }

  function currentDuration() {
    var e = activeEntry();
    if (e && e._motion && typeof e._motion.getDuration === 'function') {
      var d = e._motion.getDuration();
      if (isFinite(d) && d > 0) return d;
    }
    return (S.motions[S.current] || {}).duration || 0;
  }

  function isCurrentLoop() {
    var e = activeEntry();
    if (e && e._motion && typeof e._motion.isLoop === 'function') {
      try { return !!e._motion.isLoop(); } catch (err) {}
    }
    return !!(S.motions[S.current] || {}).loop;
  }

  function playMotion(index, silent) {
    if (!S.motions.length) return;
    index = (index + S.motions.length) % S.motions.length;
    S.current = index;
    S.seekRequest = null;
    S.motionClock = 0;
    S.holdTime = 0;
    S.finished = false;
    clearHoldEntry();
    var mo = S.motions[index];

    var mm = motionManager();
    if (mm) {
      try { mm.stopAllMotions(); } catch (e) {}
      var group = mo.group || '';
      var groupList = (mm.motionGroups && mm.motionGroups[group]) || [];

      // localIndex 在 parseMotions 里已按定义顺序算好，直接取用
      var motionObj = (typeof mo.localIndex === 'number' && mo.localIndex >= 0)
        ? groupList[mo.localIndex] : null;

      if (!motionObj) {
        // 退而求其次：按 File 路径在 groupList 里反查
        for (var g = 0; g < groupList.length; g++) {
          if (mm.getMotionFile && mm.getMotionFile(groupList[g]) === mo.file) { motionObj = groupList[g]; break; }
        }
      }

      if (motionObj) {
        // 唯一可靠的“指定动作”入口：直接把动作对象塞进队列
        // doUpdateMotion(coreModel, 当前时间) 会用「当前时间 - startTime」求进度
        mm.queueManager.startMotion(motionObj, false);
        var qe = activeEntry();
        if (qe) {
          // 把动作起点定在 0，我们自己的时钟也归零
          qe.setStartTime(0);
          mm.queueManager._doUpdateTime = 0;
        }
        mm.playing = true;
      } else {
        // 兜底：随机播放同组动作
        try { mm.startRandomMotion(group, 3); } catch (e2) {}
      }
    } else if (S.l2dModel) {
      try { S.l2dModel.motion(mo.group || '', 0).catch(function () {}); } catch (e) {}
    }

    S.playing = true;
    S.manual = false;
    S.seekRequest = null;
    setPlayIcon();
    renderMotions();
    els.badgeMotion.textContent = prettyName(mo.base) + (mo.duration ? ' · ' + mo.duration.toFixed(1) + 's' : '');
    els.progress.disabled = false;
    if (!silent) saveState();
  }

  function setPlayIcon() {
    els.icoPlay.style.display = S.playing ? 'none' : '';
    els.icoPause.style.display = S.playing ? '' : 'none';
    els.btnPlay.title = S.playing ? '暂停' : '播放';
  }

  function togglePlay() {
    if (!S.l2dModel) return;
    var mm = motionManager();
    S.playing = !S.playing;
    if (mm) { try { mm.playing = S.playing; } catch (e) {} }

    if (S.playing) {
      // 从「拖动定位」恢复：重播当前动作
      if (S.manual) {
        S.manual = false;
        S.seekRequest = null;
        playMotion(S.current, true);
        return setPlayIcon();
      }
      // 从定格恢复。已经走到末尾（自然播完 / 拖到最后）就重播；
      // 中途定格则要「从定格位置续播」，不能简单重播，否则画面会跳回开头。
      if (S.pausedEntry) {
        var hd = currentDuration();
        var atEnd = S.finished || (hd > 0 && S.holdTime >= hd - 0.05);
        var resumeAt = S.holdTime;
        clearHoldEntry();
        S.finished = false;
        if (atEnd) {
          playMotion(S.current, true);
        } else {
          resumeMotionAt(resumeAt);
        }
        return setPlayIcon();
      }
      clearHoldEntry();
      S.finished = false;
    } else {
      // 暂停：把当前进度就地钉死，防止 SDK 自己继续往前走
      if (!S.pausedEntry && S.holdTime >= 0) {
        var im = S.l2dModel.internalModel, cmp = coreModel();
        if (im && mm && mm.queueManager && cmp) {
          S.holdTime = S.motionClock;
          S.finished = false;   // 中途暂停不是「播完」，按播放应当续播
          mountHoldEntry(mm, cmp, S.holdTime);
        }
      }
    }
    setPlayIcon();
  }

  // 每个渲染帧推进动作时间轴，并把参数写进模型。
  // 该构建的 internalModel.update() 只按「帧间隔」驱动动作，不会累加时间，
  // 所以我们接管动作时间轴：自己累加 S.motionClock，再用 doUpdateMotion 算出这一帧的参数。
  // 但 internalModel.update() 同时还负责呼吸、眨眼、物理、以及最关键的
  // coreModel.update()/loadParameters()（把参数真正写进 drawable），
  // 所以仍需调用它，只是传一个极小的 dt，避免它把动作时间搞乱。
  function tickProgress(delta) {
    if (!S.l2dModel || !S.motions.length) return;
    var im = S.l2dModel.internalModel;
    var mm = motionManager();
    var cm = coreModel();
    if (!im || !mm || !mm.queueManager || !cm) return;

    var dur = currentDuration();
    els.progress.disabled = !(dur > 0);

    // 帧间隔（秒）。PIXI ticker 回调给的是「帧数」，需除以目标帧率。
    var dt;
    if (typeof delta === 'number') {
      var fps = (S.app && S.app.ticker && S.app.ticker.FPS) || 60;
      dt = delta / (fps > 1 ? fps : 60);
    } else {
      dt = (S.app && S.app.ticker && S.app.ticker.deltaMS ? S.app.ticker.deltaMS / 1000 : 1 / 60);
    }
    if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
    if (dt > 0.25) dt = 0.25;   // 从后台切回来时别一下跳太多

    var e = activeEntry();

    // 定格项已在队列里时，activeEntry() 也会返回它；这里先辨认清楚，
    // 让下面的分支走「定格」路径而不是「正常推进」路径。
    var holding = !!S.pausedEntry && e === S.pausedEntry;

    // 时间轴推进：暂停 / 手动（拖动）/ 定格时停表
    if (!holding && e && S.playing && !S.manual) {
      S.motionClock += dt * S.speed;
      S.holdTime = Math.min(S.motionClock, dur > 0 ? dur : S.motionClock);
    }

    // 手动拖动：把目标位置直接写成时间轴位置
    if (S.manual && S.seekRequest !== null) {
      S.motionClock = S.seekRequest * dur;
      S.holdTime = S.motionClock;
      S.seekRequest = null;
      S.finished = false;   // 拖动定位是中途定格，按播放应当续播
      // 拖动定位也走定格项：重新挂一次，终点始终保持在「远离目标点」的大值上。
      // 曾经这里写成 setEndTime(holdTime)，导致 endTime == 求值时刻，
      // doUpdateMotion 一进门就被 isFinished() 挡掉、动作参数根本没写进去 —— 抖动就是这么来的。
      if (S.pausedEntry) {
        try {
          var qs = mm.queueManager;
          S.pausedEntry.setStartTime(0);
          S.pausedEntry.setEndTime(HOLD_END);
          qs._doUpdateTime = S.holdTime;
          qs.doUpdateMotion(cm, S.holdTime);
        } catch (err) {}
      } else {
        mountHoldEntry(mm, cm, S.holdTime);
      }
    }

    if (holding) {
      // 暂停 / 拖动定位 / 播完定格：起止时间已在入队时定死，
      // 每帧按同一时刻重放一次即可，参数恒定不变 → 画面稳定不抖。
      S.motionClock = S.holdTime;
      var qh = mm.queueManager;
      qh._doUpdateTime = S.holdTime;
      try { qh.doUpdateMotion(cm, S.holdTime); } catch (err) {}
    } else if (e) {
      // 用我们自己的时间重算这一帧的动作参数
      var qt = mm.queueManager;
      qt._doUpdateTime = S.motionClock;
      try { qt.doUpdateMotion(cm, S.motionClock); } catch (err) {}
    } else if (!S.manual && S.holdTime > 0 && !isCurrentLoop()) {
      // 非循环动作播完后 SDK 会把队列项移除，此时把最后一帧续上，
      // 避免参数回到初始姿势、进度条突然归零。
      // 注意：这里必须「只入队一次」，否则每帧重新 startMotion 会让动作
      // 在起始姿势与末帧之间反复横跳，表现为人物持续快速抖动。
      //
      // 走到这个分支说明「原本在播、现在队列空了」= 动作自然播完。
      // 记下 finished，并把播放状态收掉：画面已定格，再显示「暂停中」会让用户困惑，
      // 而且此时按播放应当重播，若 S.playing 仍为 true 就会被误判成「暂停」。
      //
      // ⚠️ 必须排除循环动作：循环动作在绕回起点的一瞬间 isFinished() 会短暂为真，
      // SDK 随之把队列项摘掉再重新入队。若不排除，每绕一圈都会被当成「播完了」，
      // 于是把 S.playing 置为 false，表现是循环动作播一会儿就自己停住、图标乱跳。
      S.finished = true;
      S.playing = false;
      setPlayIcon();
      S.motionClock = S.holdTime;
      mountHoldEntry(mm, cm, S.holdTime);
    }

    // 交给 SDK 完成呼吸/眨眼/物理/姿势，并最终把参数提交到 drawable。
    //
    // 第一个参数（deltaMS）必须传真实帧间隔：
    //   physics.evaluate(coreModel, dt)   —— 物理是按 dt 迭代收敛的弹簧系统，
    //   pose.updateParameters(coreModel, dt) —— 部件淡入淡出同样按 dt 累积。
    // 传 0 会让它们每帧都停在同一中间态、永不收敛，画面出现持续高频微抖。
    // 第二个参数（elapsedMS）必须传 0：动作进度已由上面的 doUpdateMotion 决定，
    // 而 internalModel.update 内部的 motionManager.update() 用的是 elapsed 时间，
    // 传真实时间会让 motion 与表情层的时间基互相打架。
    try {
      im.update(dt * 1000, 0);
    } catch (err) {
      try { cm.update(); cm.loadParameters(); } catch (e2) {}
    }

    if (dur <= 0) return;

    // 定格/暂停时进度条直接读时间轴位置；正常播放时按队列项算，
    // 动作被移除（播完）时停在末端而不是归零
    var t = holding ? Math.min(S.holdTime, dur)
      : (e ? currentTime() : Math.min(S.holdTime, dur));
    var ratio = Math.max(0, Math.min(1, t / dur));
    els.progress.value = String(Math.round(ratio * 1000));
    els.progressVal.textContent = fmtSec(t) + ' / ' + dur.toFixed(2) + 's';

    // 播完自动切下一个（循环动作与手动模式除外）
    if (S.autoNext && !S.manual && !holding && !isCurrentLoop()) {
      var finished = (!e) || (t >= dur - 0.02);
      if (finished && !S._advancing) {
        S._advancing = true;
        setTimeout(function () { S._advancing = false; }, 450);
        playMotion(S.current + 1, true);
      }
    }
  }

  // 定格队列项的终点时间。必须远大于任何动作时长，让 isFinished() 恒为 false，
  // 否则 doUpdateMotion 会空转、参数写不进去（表现为人物持续抖动）。
  var HOLD_END = 3600;

  // 从定格位置「续播」：重新入队当前动作，并让它在 at 秒处接上。
  //
  // doUpdateMotion 用「t - startTime」当动作进度，startTime 会在首次
  // updateParameters 时被 SDK 重设成当时的 t。所以要续播，就得让 SDK
  // 把 startTime 设成 (当前时钟 - at)，这样 t - startTime 恰好等于 at。
  function resumeMotionAt(at) {
    var mm = motionManager(), cm = coreModel();
    if (!mm || !mm.queueManager || !cm) return;
    var mo = S.motions[S.current];
    if (!mo) return;
    var groupList = (mm.motionGroups && mm.motionGroups[mo.group || '']) || [];
    var motionObj = (typeof mo.localIndex === 'number' && mo.localIndex >= 0)
      ? groupList[mo.localIndex] : null;
    if (!motionObj) { playMotion(S.current, true); return; }
    try {
      var qt = mm.queueManager;
      qt.startMotion(motionObj, false);
      var qe = activeEntry();
      if (!qe) { playMotion(S.current, true); return; }
      var dur = mo.duration || 0;
      qe.setStartTime(0);
      qe.setEndTime(dur > 0 ? dur : -1);
      S.motionClock = at;
      S.holdTime = at;
      qt._doUpdateTime = at;
      qt.doUpdateMotion(cm, at);
    } catch (err) {
      playMotion(S.current, true);
    }
  }


  //
  // 做法：入队后把起点定在 0、终点设成 HOLD_END（一个远超任何动作时长的值），
  // 然后每帧都以同一个 t = holdTime 去求值。
  //
  // 为什么终点不能设成 holdTime 本身：
  //   doUpdateMotion 开头是 `if (!e.isAvailable() || e.isFinished()) return;`，
  //   而 isFinished() 判定 t >= endTime。若 endTime == holdTime，一入队就算 finished，
  //   doUpdateMotion 整个空转 —— 动作参数不会被写入，姿势退回默认值，
  //   呼吸/物理继续在默认值上叠加，画面上就是人物持续快速抖动。
  // 为什么终点不能设成 -1（表示「无终点」）：
  //   非循环动作走到终点会被 SDK 自动出队，我们又要重新挂，反而每帧都在重入队。
  //
  // 关键：只挂一次。每帧重新 startMotion 会让动作在起始姿势与末帧之间来回跳。
  function mountHoldEntry(mm, cm, holdTime) {
    if (S.pausedEntry) return;   // 已经挂好了，不要重复入队
    var mo = S.motions[S.current];
    if (!mo) return;
    var groupList = (mm.motionGroups && mm.motionGroups[mo.group || '']) || [];
    var motionObj = (typeof mo.localIndex === 'number' && mo.localIndex >= 0)
      ? groupList[mo.localIndex] : null;
    if (!motionObj) return;
    try {
      var qt = mm.queueManager;
      qt.startMotion(motionObj, false);
      var qe = activeEntry();
      if (!qe) return;
      // 起点给 0：SDK 首次 updateParameters 时会自己把 startTime 重设成当前 t，
      // 之后 doUpdateMotion 用的是「t - startTime」，只要 t 不变，参数就不变。
      qe.setStartTime(0);
      qe.setEndTime(HOLD_END);
      S.pausedEntry = qe;
      qt._doUpdateTime = holdTime;
      qt.doUpdateMotion(cm, holdTime);
    } catch (err) {}
  }

  // 任何时间轴要恢复「自己推进」的操作（重播 / 换动作 / 取消暂停）都必须清掉这个标记，
  // 否则上一支动作的定格项会继续挂在队列里。
  function clearHoldEntry() {
    S.pausedEntry = null;
  }

  // ---------- 6. 交互 ----------
  function bindStagePanZoom() {
    var stage = els.stage;

    stage.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      S.dragging = true;
      S.dragStart = { x: e.clientX, y: e.clientY, vx: S.view.x, vy: S.view.y };
      stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
      stage.style.cursor = 'grabbing';
    });

    stage.addEventListener('pointermove', function (e) {
      if (S.l2dModel && !S.dragging) {
        // 视线跟随
        var box = stageSize();
        var nx = (e.clientX - box.left) / box.width;
        var ny = (e.clientY - box.top) / box.height;
        try {
          var f = S.l2dModel.focus ? S.l2dModel.focus.bind(S.l2dModel) : null;
          if (f) f(e.clientX, e.clientY);
        } catch (err) {}
      }
      if (!S.dragging || !S.dragStart) return;
      S.view.x = S.dragStart.vx + (e.clientX - S.dragStart.x);
      S.view.y = S.dragStart.vy + (e.clientY - S.dragStart.y);
      applyView();
    });

    function endDrag(e) {
      if (!S.dragging) return;
      S.dragging = false;
      stage.style.cursor = '';
      try { stage.releasePointerCapture && stage.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    stage.addEventListener('wheel', function (e) {
      e.preventDefault();
      var cur = parseFloat(els.zoom.value) || 100;
      var next = cur * (e.deltaY < 0 ? 1.08 : 0.926);
      next = Math.max(20, Math.min(400, next));
      setZoomPercent(next);
    }, { passive: false });

    stage.addEventListener('dblclick', function () { resetView(); });
  }

  function bindUI() {
    els.btnPrev.addEventListener('click', function () { playMotion(S.current - 1); });
    els.btnNext.addEventListener('click', function () { playMotion(S.current + 1); });
    els.btnPlay.addEventListener('click', togglePlay);
    els.btnReplay.addEventListener('click', function () { playMotion(S.current); });
    els.btnReset.addEventListener('click', resetView);

    els.motionSearch.addEventListener('input', renderMotions);

    els.modelSearch.addEventListener('input', renderModels);

    els.progress.addEventListener('input', function () {
      S.manual = true;
      S.playing = false;
      setPlayIcon();
      var ratio = parseFloat(els.progress.value) / 1000;
      var dur = currentDuration();
      els.progressVal.textContent = fmtSec(ratio * dur) + (dur ? ' / ' + dur.toFixed(2) + 's' : '');
      // 拖动进度条时给时间轴加一个「暂停锚点」：
      // 必须把队列项就地钉死，否则 SDK 会继续按自己的时间基推进，
      // 松手瞬间会跳回原位置。
      if (!S.pausedEntry && S.l2dModel) {
        var im = S.l2dModel.internalModel, mmp = motionManager(), cmp = coreModel();
        if (im && mmp && mmp.queueManager && cmp) {
          S.holdTime = ratio * dur;
          mountHoldEntry(mmp, cmp, S.holdTime);
        }
      }
      // 手动模式下由时间轴拖动驱动动作进度（见 tickProgress 的 manual 分支）
      S.seekRequest = ratio;
    });

    els.speed.addEventListener('input', function () {
      S.speed = parseFloat(els.speed.value) / 100;
      els.speedVal.textContent = S.speed.toFixed(2) + '×';
      saveState();
    });

    els.zoom.addEventListener('input', function () {
      setZoomPercent(parseFloat(els.zoom.value));
    });

    els.autoNext.addEventListener('change', function () {
      S.autoNext = els.autoNext.checked;
      saveState();
    });

    els.showWire.addEventListener('change', function () { toggleWire(els.showWire.checked); });

    els.btnTheme.addEventListener('click', function () {
      var dark = els.stage.classList.toggle('dark');
      els.btnTheme.classList.toggle('on', dark);
      els.btnTheme.textContent = dark ? '浅色舞台' : '深色舞台';
      saveState();
    });

    els.modeSeg.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      [].forEach.call(els.modeSeg.children, function (c) { c.classList.remove('on'); });
      b.classList.add('on');
      var mode = b.dataset.mode;
      if (mode === 'auto') { S.autoNext = true; els.autoNext.checked = true; togglePlayTo(true); }
      else if (mode === 'manual') { S.autoNext = false; els.autoNext.checked = false; S.manual = true; }
      else { S.autoNext = false; els.autoNext.checked = false; S.manual = false; togglePlayTo(true); }
      saveState();
    });

    window.addEventListener('keydown', function (e) {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') playMotion(S.current + 1);
      else if (e.key === 'ArrowLeft') playMotion(S.current - 1);
      else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
      else if (e.key === 'r' || e.key === 'R') playMotion(S.current);
    });

    window.addEventListener('resize', function () {
      var keep = parseFloat(els.zoom.value) || 100;
      var box = stageSize();
      if (S.app) S.app.renderer.resize(box.w, box.h);
      setZoomPercent(keep);
    });
  }

  function togglePlayTo(on) {
    if (!S.l2dModel) return;
    S.playing = on;
    var mm = motionManager();
    if (mm) { try { mm.playing = on; } catch (e) {} }
    setPlayIcon();
  }

  function toggleWire(on) {
    S.wireOn = on;
    if (on && !S.wire) {
      var g = new PIXI.Graphics();
      g.alpha = 0.22;
      S.wire = g;
      S.app.stage.addChildAt(g, 0);
      drawWire(g);
    }
    if (S.wire) S.wire.visible = on;
  }

  function drawWire(g) {
    if (!g) return;
    var box = stageSize();
    g.clear();
    g.lineStyle(1, 0x8fa4c4, 1);
    var step = 40, x, y;
    for (x = 0; x <= box.w; x += step) { g.moveTo(x, 0); g.lineTo(x, box.h); }
    for (y = 0; y <= box.h; y += step) { g.moveTo(0, y); g.lineTo(box.w, y); }
    g.lineStyle(1, 0x3d6fe0, 1);
    g.moveTo(box.w / 2, 0); g.lineTo(box.w / 2, box.h);
    g.moveTo(0, box.h / 2); g.lineTo(box.w, box.h / 2);
  }

  // ---------- 7. 启动 ----------
  function initPixi() {
    var box = stageSize();
    S.app = new PIXI.Application({
      width: box.w,
      height: box.h,
      backgroundAlpha: 0,
      antialias: true,
      autoDensity: true,
      resolution: Math.min(2, window.devicePixelRatio || 1),
      powerPreference: 'high-performance'
    });
    els.host.appendChild(S.app.view);
    S.app.view.style.position = 'absolute';
    S.app.view.style.inset = '0';
  }

  function ensureCore() {
    return new Promise(function (resolve, reject) {
      if (window.Live2DCubismCore) return resolve();
      var s = document.createElement('script');
      s.src = CORE_URL;
      s.onload = function () {
        if (window.Live2DCubismCore) resolve(); else reject(new Error('Core 脚本已加载但未导出 Live2DCubismCore'));
      };
      s.onerror = function () { reject(new Error('无法加载 ' + CORE_URL)); };
      document.head.appendChild(s);
    });
  }

  function boot() {
    if (!window.Live2DCubismCore) {
      showOverlay('Live2D Cubism Core 未加载', '找不到 assets/live2dcubismcore.min.js', true, false);
      return;
    }
    if (!window.PIXI || !PIXI.live2d) {
      showOverlay('渲染库未加载', 'pixi.min.js 或 cubism4.min.js 加载失败', true, false);
      return;
    }
    initPixi();
    bindStagePanZoom();
    bindUI();

    var st = loadState();
    if (st && st.dark) {
      els.stage.classList.add('dark');
      els.btnTheme.classList.add('on');
      els.btnTheme.textContent = '浅色舞台';
    }
    if (st && typeof st.speed === 'number') {
      S.speed = st.speed;
      els.speed.value = String(Math.round(st.speed * 100));
      els.speedVal.textContent = S.speed.toFixed(2) + '×';
    }
    S.autoNext = !!(st && st.autoNext);
    els.autoNext.checked = S.autoNext;
    S.collapsed = (st && st.collapsed && typeof st.collapsed === 'object') ? st.collapsed : {};

    showOverlay('正在扫描模型…', '', false, true);

    discoverModels().then(function (list) {
      S.models = list;
      if (!S.models.length) {
        showOverlay(
          '没有找到任何模型',
          '把 Live2D 模型文件夹（含 .model3.json）直接放进 models/ 目录即可，支持多层嵌套。' +
          '本地用 file:// 打开时浏览器不允许列目录，请改用 HTTP 服务器访问，或先运行 python build_index.py 生成 models/index.json。',
          true, false
        );
        return;
      }
      els.brandSub.textContent = S.models.length + ' 个模型';

      // 记录发现来源，便于排查
      if (S.source === 'github') els.modelCount.title = '来源：GitHub API 自动发现';
      else if (S.source === 'index') els.modelCount.title = '来源：models/index.json';
      else els.modelCount.title = '来源：内置兜底清单';

      renderModels();
      var pick = S.models[0];
      if (st && st.model) {
        for (var i = 0; i < S.models.length; i++) {
          if (S.models[i].key === st.model) { pick = S.models[i]; break; }
        }
      }
      switchModel(pick);
      S.app.ticker.add(tickProgress);

      // 只读调试面板：这个 SDK 的内部状态（动作队列、自维护时钟）不好从外部观察，
      // 出问题时在控制台执行 __viewer.info() 就能看到关键量。不参与任何页面逻辑。
      try {
        window.__viewer = {
          S: S, els: els, app: S.app,
          mm: motionManager,
          info: function () {
            var m = motionManager();
            var e = activeEntry();
            return {
              model: S.model && S.model.key,
              source: S.source,
              motions: S.motions.length,
              current: S.current,
              playing: S.playing,
              manual: S.manual,
              autoNext: S.autoNext,
              speed: S.speed,
              clock: S.motionClock,
              t: currentTime(),
              dur: currentDuration(),
              holdTime: S.holdTime,
              finished: S.finished,
              paused: !!S.pausedEntry,
              holdIsActive: !!S.pausedEntry && e === S.pausedEntry,
              autoUpdate: S.l2dModel && S.l2dModel.autoUpdate,
              queueLen: m && m.queueManager ? (m.queueManager._motions || []).length : -1,
              hasEntry: !!e,
              entryStart: e ? e.getStartTime() : null,
              entryEnd: e ? e.getEndTime() : null,
              tickerStarted: S.app.ticker.started
            };
          }
        };
      } catch (e) { /* 调试钩子失败不影响页面 */ }
    }).catch(function (err) {
      var reasons = (err && err.reasons) || [err && err.message].filter(Boolean);
      showOverlay(
        '没有找到任何模型',
        '把 Live2D 模型文件夹（内含 .model3.json）整个放进 models/ 目录即可，支持多层嵌套。\n' +
        '本地打开时浏览器不允许列目录，请用 HTTP 服务器访问（python -m http.server），' +
        '或先运行 python build_index.py 生成 models/index.json。\n' +
        (reasons.length ? '\n各级尝试的结果：\n· ' + reasons.join('\n· ') : ''),
        true, false
      );
    });
  }

  // 兜底清单：GitHub API 与 models/index.json 都不可用时使用。
  // 形状与 decorate() 的输入一致：{ path, file, name }
  //   path —— 模型相对 models/ 的目录，多层用 '/' 连接（模型直接放在 models/ 根下时才用 ''）
  //   file —— 该目录下的 .model3.json 文件名
  // 这里只保留一个模型，只为保证「什么都读不到」时页面仍能起来；
  // 正常情况下走 A/B 两级，模型列表是完整的。
  window.MODELS_FALLBACK = [
    { path: 'aimierbeierding_2', file: 'aimierbeierding_2.model3.json', name: 'aimierbeierding_2' }
  ];

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
